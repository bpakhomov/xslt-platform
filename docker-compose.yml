services:
  xsltservice:
    build:
      context: ./xsltservice
      dockerfile: Dockerfile
    container_name: xsltservice
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/converterdb
      - DB_USER=postgres
      - DB_PSWD=postgres
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/converterdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - XSLTCONVERTER_URL=http://xsltconverter:8081
      - CONVERTER_SERVICE_USER=xsltservice
      - CONVERTER_SERVICE_PASSWORD=xsltservice-secret
      - XSLTCONVERTER_TRANSPORT=${XSLTCONVERTER_TRANSPORT:-kafka}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - XSLTCONVERTER_RETRY_MAX_RETRIES=3
      - XSLTCONVERTER_RETRY_DELAY_MS=1100
      - XSLTCONVERTER_RETRY_MULTIPLIER=1.5
      - XSLTCONVERTER_RETRY_MAX_DELAY_MS=3000
      - S3SERVICE_URL=http://s3service:8082
      - MIGRATION_DELAY_MS=60000
      - MIGRATION_ROWS_LIMIT=100
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_TTL_MINUTES=10
    depends_on:
      postgres:
        condition: service_healthy
      xsltconverter:
        condition: service_started
      s3service:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  xsltconverter:
    build:
      context: ./xsltconverter
      dockerfile: Dockerfile
    container_name: xsltconverter
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/converter_users
      - DB_USER=postgres
      - DB_PSWD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_TTL_MINUTES=10
      - JWT_SECRET=local-dev-xsltconverter-jwt-secret-key-2026-change-me
      - JWT_EXPIRATION_MINUTES=60
      - CONVERTER_SERVICE_USER=xsltservice
      - CONVERTER_SERVICE_PASSWORD=xsltservice-secret
      - XSLTCONVERTER_TRANSPORT=${XSLTCONVERTER_TRANSPORT:-kafka}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - XML2FORMAT_RATE_LIMIT_RPS=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  s3service:
    build:
      context: ./s3service
      dockerfile: Dockerfile
    container_name: s3service
    ports:
      - "8082:8082"
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=xslt-storage
    depends_on:
      - minio
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: converterdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d converterdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  kafka_data:

