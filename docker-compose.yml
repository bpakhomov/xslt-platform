services:
  xsltservice:
    build:
      context: ./xsltservice
      dockerfile: Dockerfile
    container_name: xsltservice
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/converterdb
      - DB_USER=postgres
      - DB_PSWD=postgres
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/converterdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - XSLTCONVERTER_URL=http://xsltconverter:8081
    depends_on:
      postgres:
        condition: service_healthy
      xsltconverter:
        condition: service_started
    restart: unless-stopped

  xsltconverter:
    build:
      context: ./xsltconverter
      dockerfile: Dockerfile
    container_name: xsltconverter
    ports:
      - "8081:8081"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: converterdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d converterdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
