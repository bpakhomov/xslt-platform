spring.application.name=xsltconverter
server.port=${SERVER_PORT:8081}

springdoc.swagger-ui.path=/swagger.html

redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.timeout-ms=${REDIS_TIMEOUT_MS:2000}

cache.ttl-minutes=${CACHE_TTL_MINUTES:10}
cache.compress-threshold-bytes=${CACHE_COMPRESS_THRESHOLD_BYTES:4096}

jwt.secret=${JWT_SECRET:local-dev-xsltconverter-jwt-secret-key-2026-change-me}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
service-auth.username=${CONVERTER_SERVICE_USER:xsltservice}
service-auth.password=${CONVERTER_SERVICE_PASSWORD:xsltservice-secret}

logging.file.name=${LOG_FILE:logs/xsltconverter.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
