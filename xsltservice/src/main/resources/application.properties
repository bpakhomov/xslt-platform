spring.application.name=xsltservice

xsltconverter.url=${XSLTCONVERTER_URL:http://localhost:8081}
xsltconverter.auth.username=${CONVERTER_SERVICE_USER:xsltservice}
xsltconverter.auth.password=${CONVERTER_SERVICE_PASSWORD:xsltservice-secret}
xsltconverter.retry.max-retries=${XSLTCONVERTER_RETRY_MAX_RETRIES:3}
xsltconverter.retry.delay-ms=${XSLTCONVERTER_RETRY_DELAY_MS:1100}
xsltconverter.retry.multiplier=${XSLTCONVERTER_RETRY_MULTIPLIER:1.5}
xsltconverter.retry.max-delay-ms=${XSLTCONVERTER_RETRY_MAX_DELAY_MS:3000}
s3service.url=${S3SERVICE_URL:http://localhost:8082}

migration.delay-ms=${MIGRATION_DELAY_MS:60000}
migration.rows-limit=${MIGRATION_ROWS_LIMIT:100}

redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}
redis.timeout-ms=${REDIS_TIMEOUT_MS:2000}

cache.ttl-minutes=${CACHE_TTL_MINUTES:10}
cache.compress-threshold-bytes=${CACHE_COMPRESS_THRESHOLD_BYTES:4096}
auth.cache.ttl-minutes=${AUTH_CACHE_TTL_MINUTES:5}
